<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 354 209" role="img"><title>limiter</title><rect width="100%" height="100%" fill="white"/><rect x="0" y="0" width="354" height="25" rx="5" fill="#182b42" stroke="none" stroke-width="0.8"/><text x="7" y="17" text-anchor="start" fill="#ffffff" font-family="Georgia, serif" font-weight="bold" font-size="8.5">EXACT WINDOW: EXPIRE BEFORE TESTING CAPACITY</text><rect x="5" y="90" width="74" height="54" rx="5" fill="#f8f9fb" stroke="#555555" stroke-width="0.8"/><text x="42.0" y="114.0" text-anchor="middle" fill="#202020" font-family="Georgia, serif" font-weight="normal" font-size="9">time 0</text><text x="42.0" y="126.0" text-anchor="middle" fill="#202020" font-family="Georgia, serif" font-weight="normal" font-size="9">EXPIRED</text><rect x="94" y="90" width="74" height="54" rx="5" fill="#dde5ed" stroke="#555555" stroke-width="0.8"/><text x="131.0" y="114.0" text-anchor="middle" fill="#202020" font-family="Georgia, serif" font-weight="normal" font-size="9">time 4</text><text x="131.0" y="126.0" text-anchor="middle" fill="#202020" font-family="Georgia, serif" font-weight="normal" font-size="9">ACTIVE</text><rect x="183" y="90" width="74" height="54" rx="5" fill="#dde5ed" stroke="#555555" stroke-width="0.8"/><text x="220.0" y="114.0" text-anchor="middle" fill="#202020" font-family="Georgia, serif" font-weight="normal" font-size="9">time 9</text><text x="220.0" y="126.0" text-anchor="middle" fill="#202020" font-family="Georgia, serif" font-weight="normal" font-size="9">ACTIVE</text><rect x="272" y="90" width="74" height="54" rx="5" fill="#dde5ed" stroke="#555555" stroke-width="0.8"/><text x="309.0" y="114.0" text-anchor="middle" fill="#202020" font-family="Georgia, serif" font-weight="normal" font-size="9">time 10</text><text x="309.0" y="126.0" text-anchor="middle" fill="#202020" font-family="Georgia, serif" font-weight="normal" font-size="9">NEW</text><rect x="3" y="50" width="191.16796875" height="11" fill="#ffffff" stroke="none" stroke-width="0.8"/><text x="5" y="59" text-anchor="start" fill="#202020" font-family="Georgia, serif" font-weight="normal" font-size="8">At now = 10, accepted timestamps must be in (0, 10].</text><rect x="3" y="160" width="202.65625" height="11" fill="#ffffff" stroke="none" stroke-width="0.8"/><text x="5" y="169" text-anchor="start" fill="#202020" font-family="Georgia, serif" font-weight="normal" font-size="8">1  Remove 0.     2  Count 4 and 9.     3  Accept the new 10.</text><rect x="3" y="186" width="223.72265625" height="11" fill="#ffffff" stroke="none" stroke-width="0.8"/><text x="5" y="195" text-anchor="start" fill="#202020" font-family="Georgia, serif" font-weight="normal" font-size="8">A second request at 10 is rejected: three slots are already used.</text></svg>
