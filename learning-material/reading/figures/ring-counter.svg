<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 354 180" role="img"><title>ring-counter</title><rect width="100%" height="100%" fill="white"/><rect x="0" y="0" width="354" height="25" rx="5" fill="#182b42" stroke="none" stroke-width="0.8"/><text x="7" y="17" text-anchor="start" fill="#ffffff" font-family="Georgia, serif" font-weight="bold" font-size="8.5">RING SLOT NUMBER IS NOT TIME IDENTITY</text><line x1="72.85714285714286" y1="100.0" x2="98.57142857142857" y2="130.0" stroke="#555555" stroke-width="0.8"/><line x1="98.57142857142857" y1="130.0" x2="97.29266480698234" y2="125.16628887553887" stroke="#555555" stroke-width="0.8"/><line x1="98.57142857142857" y1="130.0" x2="93.99016027122934" y2="127.99700704904143" stroke="#555555" stroke-width="0.8"/><rect x="8" y="63" width="98" height="37" rx="5" fill="#f8f9fb" stroke="#555555" stroke-width="0.8"/><text x="57.0" y="78.5" text-anchor="middle" fill="#202020" font-family="Georgia, serif" font-weight="normal" font-size="9">time 0</text><text x="57.0" y="90.5" text-anchor="middle" fill="#202020" font-family="Georgia, serif" font-weight="normal" font-size="9">slot 0</text><rect x="128" y="63" width="98" height="37" rx="5" fill="#f8f9fb" stroke="#555555" stroke-width="0.8"/><text x="177.0" y="78.5" text-anchor="middle" fill="#202020" font-family="Georgia, serif" font-weight="normal" font-size="9">time 1</text><text x="177.0" y="90.5" text-anchor="middle" fill="#202020" font-family="Georgia, serif" font-weight="normal" font-size="9">slot 1</text><rect x="248" y="63" width="98" height="37" rx="5" fill="#f8f9fb" stroke="#555555" stroke-width="0.8"/><text x="297.0" y="78.5" text-anchor="middle" fill="#202020" font-family="Georgia, serif" font-weight="normal" font-size="9">time 2</text><text x="297.0" y="90.5" text-anchor="middle" fill="#202020" font-family="Georgia, serif" font-weight="normal" font-size="9">slot 2</text><rect x="8" y="130" width="218" height="43" rx="5" fill="#dde5ed" stroke="#555555" stroke-width="0.8"/><text x="117.0" y="148.5" text-anchor="middle" fill="#202020" font-family="Georgia, serif" font-weight="normal" font-size="9">time 3 reuses slot 0</text><text x="117.0" y="160.5" text-anchor="middle" fill="#202020" font-family="Georgia, serif" font-weight="normal" font-size="9">reset count; store timestamp 3</text><rect x="6" y="41" width="149.90625" height="11" fill="#ffffff" stroke="none" stroke-width="0.8"/><text x="8" y="50" text-anchor="start" fill="#202020" font-family="Georgia, serif" font-weight="normal" font-size="8">W = 3 slots; index = timestamp % 3</text></svg>
