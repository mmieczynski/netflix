<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 354 195" role="img"><title>token-bucket</title><rect width="100%" height="100%" fill="white"/><rect x="0" y="0" width="354" height="25" rx="5" fill="#182b42" stroke="none" stroke-width="0.8"/><text x="7" y="17" text-anchor="start" fill="#ffffff" font-family="Georgia, serif" font-weight="bold" font-size="8.5">TOKENS REPRESENT UNUSED PERMISSION</text><line x1="106.0" y1="80.0" x2="128.0" y2="80.0" stroke="#555555" stroke-width="0.8"/><line x1="128.0" y1="80.0" x2="123.49776448823661" y2="77.82517232944384" stroke="#555555" stroke-width="0.8"/><line x1="128.0" y1="80.0" x2="123.49776448823661" y2="82.17482767055616" stroke="#555555" stroke-width="0.8"/><line x1="226.0" y1="80.0" x2="248.0" y2="80.0" stroke="#555555" stroke-width="0.8"/><line x1="248.0" y1="80.0" x2="243.4977644882366" y2="77.82517232944384" stroke="#555555" stroke-width="0.8"/><line x1="248.0" y1="80.0" x2="243.4977644882366" y2="82.17482767055616" stroke="#555555" stroke-width="0.8"/><rect x="8" y="60" width="98" height="40" rx="5" fill="#dde5ed" stroke="#555555" stroke-width="0.8"/><text x="57.0" y="77.0" text-anchor="middle" fill="#202020" font-family="Georgia, serif" font-weight="normal" font-size="9">Start</text><text x="57.0" y="89.0" text-anchor="middle" fill="#202020" font-family="Georgia, serif" font-weight="normal" font-size="9">3 tokens</text><rect x="128" y="60" width="98" height="40" rx="5" fill="#f8f9fb" stroke="#555555" stroke-width="0.8"/><text x="177.0" y="77.0" text-anchor="middle" fill="#202020" font-family="Georgia, serif" font-weight="normal" font-size="9">3 accepts</text><text x="177.0" y="89.0" text-anchor="middle" fill="#202020" font-family="Georgia, serif" font-weight="normal" font-size="9">0 tokens</text><rect x="248" y="60" width="98" height="40" rx="5" fill="#dde5ed" stroke="#555555" stroke-width="0.8"/><text x="297.0" y="77.0" text-anchor="middle" fill="#202020" font-family="Georgia, serif" font-weight="normal" font-size="9">Wait 1s</text><text x="297.0" y="89.0" text-anchor="middle" fill="#202020" font-family="Georgia, serif" font-weight="normal" font-size="9">1 token</text><rect x="8" y="139" width="338" height="44" rx="5" fill="#f8f9fb" stroke="#555555" stroke-width="0.8"/><text x="177.0" y="158.0" text-anchor="middle" fill="#202020" font-family="Georgia, serif" font-weight="normal" font-size="9">balance = min(capacity, balance + elapsed * rate)</text><text x="177.0" y="170.0" text-anchor="middle" fill="#202020" font-family="Georgia, serif" font-weight="normal" font-size="9">accept only when balance &gt;= 1; then subtract 1</text></svg>
