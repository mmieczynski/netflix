        - paragraph [ref=e125]: For seven study sessions, pair lessons 0 and 1, then 2 and 3, then 4 and 5, then 6 and 7, then 8 and 9, then 10 and 11, and finish with the mocks. The cache session is longer; split it if concentration falls. Begin later sessions with five minutes of recall from an earlier topic, using time from that session's review allocation.
        - heading "The interview loop to practise" [level=2] [ref=e126]
        - paragraph [ref=e127]: "First restate the observable behavior. “For each user, I need to accept at most three requests in the preceding ten seconds, excluding the left boundary.” Ask about ambiguous inputs that change the algorithm: sorted arrival, duplicate IDs, concurrency, capacity, and return values. Avoid spending ten minutes collecting hypothetical requirements."
        - paragraph [ref=e128]: "Next give a correct baseline. A scan can be a useful first version. Identify its expensive operation, then select a structure that makes that operation cheaper. Say the invariant before writing the implementation. An invariant is a claim that is true before and after every public operation: for example, every live cache key has exactly one node in both the map and the recency list."
        - paragraph [ref=e129]: Walk one tiny example manually. Implement a vertical slice that runs. Test the example, an empty input, an exact boundary, and a case that defeats your first idea. Explain time and space using meaningful variables. “Each request is appended once and removed once” is stronger reasoning than merely saying “linear.” Finish with the next requirement and what would actually change.
        - paragraph [ref=e130]: A suggested 50 minute rehearsal budget is five minutes to clarify and model, five to discuss the baseline and improvement, twenty five to implement, ten to test, and five for a follow-up. This is a practice schedule, not a claim about Netflix's interview duration. If your invitation gives another duration, scale it. In a live session, tell the interviewer when you need a minute to think and return with a concrete hypothesis.
