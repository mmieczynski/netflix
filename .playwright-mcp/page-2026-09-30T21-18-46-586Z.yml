          - text: .
        - paragraph [ref=e142]: Public Netflix interview reports vary and many search results are promotional or secondhand. No official role-specific first-round question list was established in this research. Therefore the priorities here are a preparation judgment based on your plan and the transferable skills needed for live coding, not measured probabilities. The Sources lesson separates platform facts, company context, and our original practice material.
        - heading "Your first 30 minutes" [level=2] [ref=e143]
        - paragraph [ref=e144]: Spend ten minutes with this orientation, ten explaining a map based duplicate detector without code, and ten writing it in Go. Return the first repeated ID and a boolean. Test an empty list, two adjacent duplicates, a duplicate far apart, and no duplicate. If syntax blocks you, spend extra time in lesson 1. If the code is easy but explaining why it works is hard, keep every later speaking checkpoint.
