        - heading "Netflix L5 live coding preparation in Go" [level=1] [ref=e61]
        - paragraph [ref=e62]: A 14 hour course for reasoning through unfamiliar coding problems, explaining decisions to another senior engineer, and adapting when requirements change.
        - paragraph [ref=e63]: This course assumes basic programming experience and focuses on your first technical interview through CodeSignal. It does not assume a particular Netflix team or a guaranteed question list. Your original plan gives caches and rate limiting extra weight; this course adds enough algorithms to avoid preparing for only one kind of problem. Recommendation exercises are small programs with explicit contracts, rather than an ML system design syllabus.
        - heading "How to spend the 14 hours" [level=2] [ref=e64]
        - paragraph [ref=e65]: The estimates include reading or listening, thinking aloud, implementing, testing, and reviewing. Reading every page without doing the exercises will take much less time and will not provide the same preparation. Use each lesson's time box. Stop when it expires, record what was difficult, and revisit that skill later. Optional extensions are outside the 14 hour route.
