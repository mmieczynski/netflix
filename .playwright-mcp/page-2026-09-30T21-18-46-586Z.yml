        - heading "Reading and listening" [level=2] [ref=e135]
        - paragraph [ref=e136]: Every concept has prose that can stand without the code. Listen pauses at “Think aloud” checkpoints. Speak your answer before pressing Continue; reveal the coach notes afterward if needed. Code blocks are for the later hands-on part and are skipped by narration. Browser speech uses the voices available on your machine; voice quality and offline availability depend on the voice.
        - paragraph [ref=e137]: For an actual conversation, copy the AI tutor prompt for the current lesson into an AI tool that supports voice. It supplies the lesson and tells the tutor to ask one question at a time, challenge your assumptions, and withhold solutions until you have tried. The local reader has narration and reflection checkpoints; it has no embedded AI service or microphone recording.
        - heading "What the research can establish" [level=2] [ref=e138]
        - paragraph [ref=e139]:
          - text: CodeSignal distinguishes live interviewing from assessments and offers practice to familiarize yourself with its environment. That does not establish the question type, timer, or allowed resources for your particular interview. Practise in the environment linked from your invitation and confirm the Go runtime there.
